# ─── PodDisruptionBudgets ────────────────────────────────────────────
# Ensures at least 1 pod stays alive during:
#   - Node drains (kubectl drain)
#   - Cluster Autoscaler scale-downs
#   - Rolling updates
# Deploy: kubectl apply -f gitops/k8s/pdb.yaml
# ─────────────────────────────────────────────────────────────────────

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: gnosis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
